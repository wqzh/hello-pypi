<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Pi Agent</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  body { display: flex; background: #f7f7f8; color: #1f1f1f; }

  #sidebar {
    width: 280px; min-width: 220px; height: 100vh;
    background: #202123; color: #ececf1;
    display: flex; flex-direction: column;
    border-right: 1px solid #2d2d33;
  }
  #sidebar .top { padding: 12px; border-bottom: 1px solid #2d2d33; }
  #newBtn {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #4a4a52; background: transparent; color: #ececf1;
    cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px;
    transition: background .15s;
  }
  #newBtn:hover { background: #2a2a32; }

  #sessionList { flex: 1; overflow-y: auto; padding: 8px; }
  .session-item {
    padding: 10px 12px; border-radius: 8px; margin-bottom: 4px;
    cursor: pointer; font-size: 14px; color: #ececf1;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; transition: background .15s;
  }
  .session-item:hover { background: #2a2a32; }
  .session-item.active { background: #343541; }
  .session-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .time { font-size: 11px; color: #666; margin-right: 4px; }
  .session-item .del { opacity: 0; font-size: 12px; color: #9a9aa0; padding: 2px 4px; border-radius: 4px; }
  .session-item:hover .del { opacity: 1; }
  .session-item .del:hover { background: #4a4a52; color: #fff; }

  #main { flex: 1; display: flex; flex-direction: column; height: 100vh; background: #fff; }
  #header {
    padding: 12px 24px; border-bottom: 1px solid #e5e5e7;
    font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 12px;
  }
  #header .status { font-size: 12px; font-weight: 400; color: #8e8ea0; }

  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg {
    max-width: 820px; width: fit-content;
    padding: 12px 16px; border-radius: 12px;
    font-size: 15px; line-height: 1.65;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: #e7f0ff; color: #1a3d7c; border: 1px solid #cfe0ff; }
  .msg.assistant { align-self: flex-start; background: #f5f5f7; color: #1f1f1f; border: 1px solid #ececf1; }
  .msg.thinking {
    align-self: flex-start; background: #fffaf0; color: #7a5a1f;
    border: 1px dashed #f0d18a; font-size: 13px; max-width: 820px;
  }
  .msg.thinking .label { font-weight: 600; margin-bottom: 4px; color: #a07a2a; }
  .msg.thinking .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.tool {
    align-self: flex-start; background: #eef8ee; color: #205c20;
    border: 1px solid #cfe8cf; font-size: 13px; max-width: 820px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .msg.tool .label { font-weight: 600; margin-bottom: 4px; color: #2e7d32; }
  .msg.tool .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.error { align-self: flex-start; background: #fdecec; color: #8a1f1f; border: 1px solid #f5c2c2; }

  #composer { border-top: 1px solid #e5e5e7; padding: 12px 24px 20px; display: flex; gap: 10px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; min-height: 44px; max-height: 200px;
    padding: 10px 14px; border-radius: 10px; border: 1px solid #d9d9e3;
    font-size: 15px; font-family: inherit; line-height: 1.5; outline: none;
  }
  #input:focus { border-color: #8e8ea0; }
  #sendBtn {
    padding: 10px 18px; border-radius: 10px; border: none;
    background: #19c37d; color: #fff; font-size: 15px; cursor: pointer; transition: background .15s;
  }
  #sendBtn:hover { background: #16a86c; }
  #sendBtn:disabled { background: #b7e4cd; cursor: not-allowed; }

  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #8e8ea0; font-size: 15px; }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="top">
    <button id="newBtn">＋ 新建对话</button>
  </div>
  <div id="sessionList"></div>
</aside>

<main id="main">
  <div id="header">
    <span id="title">未选择会话</span>
    <span class="status" id="status"></span>
  </div>
  <div id="messages">
    <div class="empty">点击左侧"新建对话"开始</div>
  </div>
  <div id="composer">
    <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="sendBtn">发送</button>
  </div>
</main>

<script>
const API = "";
let currentSid = null;
let ws = null;
let sessions = [];

const sessionListEl = document.getElementById("sessionList");
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const newBtn = document.getElementById("newBtn");
const titleEl = document.getElementById("title");
const statusEl = document.getElementById("status");

async function refreshSessions() {
  const r = await fetch(API + "/api/sessions");
  sessions = await r.json();
  renderSessionList();
}

function renderSessionList() {
  sessionListEl.innerHTML = "";
  if (sessions.length === 0) {
    sessionListEl.innerHTML = `<div style="color:#8e8ea0;font-size:13px;padding:12px;">暂无会话</div>`;
    return;
  }
  for (const s of sessions) {
    const div = document.createElement("div");
    div.className = "session-item" + (s.id === currentSid ? " active" : "");
    const preview = s.preview || s.title || "新对话";
    const timeStr = new Date(s.created_at * 1000).toLocaleString("zh-CN", {
      month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
    });
    div.innerHTML = `<span class="title"></span><span class="time"></span><span class="del">✕</span>`;
    div.querySelector(".title").textContent = preview;
    div.querySelector(".time").textContent = timeStr;
    div.addEventListener("click", (e) => {
      if (e.target.classList.contains("del")) return;
      openSession(s.id);
    });
    div.querySelector(".del").addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("删除该对话？")) return;
      await fetch(API + "/api/sessions/" + s.id, { method: "DELETE" });
      if (currentSid === s.id) {
        currentSid = null;
        titleEl.textContent = "未选择会话";
        messagesEl.innerHTML = `<div class="empty">点击左侧"新建对话"开始</div>`;
        closeWs();
      }
      refreshSessions();
    });
    sessionListEl.appendChild(div);
  }
}

async function newSession() {
  const r = await fetch(API + "/api/sessions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: "新对话" }),
  });
  const data = await r.json();
  await refreshSessions();
  openSession(data.id);
}

async function openSession(sid) {
  currentSid = sid;
  const meta = sessions.find(s => s.id === sid);
  titleEl.textContent = meta ? meta.title : "对话";
  await refreshSessions();

  const r = await fetch(API + "/api/sessions/" + sid + "/messages");
  const data = await r.json();
  messagesEl.innerHTML = "";
  if (!data.messages || data.messages.length === 0) {
    messagesEl.innerHTML = `<div class="empty">开始你的第一句话吧</div>`;
  } else {
    for (const m of data.messages) {
      if (m.role === "user") {
        appendMessage("user", m.content);
      } else if (m.role === "assistant") {
        if (m.thinking && m.thinking.trim()) {
          appendThinking(m.thinking.trim());
        }
        if (m.content && m.content.trim()) {
          appendMessage("assistant", m.content);
        }
      } else if (m.role === "tool") {
        // 历史工具块：展示工具名 + 参数 + 结果
        appendTool(m.tool_name || "工具", m.args || {}, m.result || "");
      }
    }
  }
  scrollBottom();

  closeWs();
  connectWs(sid);
}

function closeWs() {
  if (ws) { try { ws.close(); } catch(e){} ws = null; }
}

function connectWs(sid) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/${sid}`);

  ws.onopen = () => { statusEl.textContent = "已连接"; };
  ws.onclose = () => { statusEl.textContent = "已断开"; };
  ws.onerror = () => { statusEl.textContent = "连接错误"; };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleServerEvent(data);
  };
}

let currentAssistantEl = null;
let currentThinkingEl = null;
let currentToolEls = {};
let bufferedText = "";

function handleServerEvent(data) {
  switch (data.type) {
    case "user_saved":
      if (data.title) {
        titleEl.textContent = data.title;
        refreshSessions();
      }
      break;

    case "text_delta":
      if (currentThinkingEl) {
        bufferedText += data.delta;
      } else {
        if (!currentAssistantEl) {
          currentAssistantEl = appendMessage("assistant", "");
        }
        currentAssistantEl.textContent += data.delta;
      }
      scrollBottom();
      break;

    case "thinking_start":
      currentThinkingEl = appendMessage("thinking", "");
      currentThinkingEl.innerHTML = `<div class="label">💭 思考中...</div><div class="body"></div>`;
      bufferedText = "";
      scrollBottom();
      break;

    case "thinking_delta":
      if (currentThinkingEl) {
        currentThinkingEl.querySelector(".body").textContent += data.delta;
        scrollBottom();
      }
      break;

    case "thinking_end":
      if (currentThinkingEl) {
        currentThinkingEl.querySelector(".label").textContent = "💭 思考完成";
        currentThinkingEl = null;
      }
      if (bufferedText) {
        currentAssistantEl = appendMessage("assistant", bufferedText);
        bufferedText = "";
        scrollBottom();
      }
      break;

    case "tool_start": {
      const el = appendMessage("tool", "");
      el.innerHTML = `<div class="label">🔧 调用工具: ${escapeHtml(data.tool_name)}</div><div class="body">参数: ${escapeHtml(JSON.stringify(data.args))}</div>`;
      currentToolEls[data.tool_name] = el;
      scrollBottom();
      break;
    }

    case "tool_end": {
      const el = currentToolEls[data.tool_name];
      if (el) {
        el.querySelector(".body").textContent += `\n结果: ${data.result}`;
        delete currentToolEls[data.tool_name];
      }
      scrollBottom();
      break;
    }

    case "message_end":
      currentAssistantEl = null;
      bufferedText = "";
      break;

    case "compact":
      appendMessage("tool", `📦 上下文压缩: ${data.before} → ${data.after} tokens`);
      break;

    case "warn":
      appendMessage("tool", `⚠️ ${data.message}`);
      break;

    case "error":
      appendMessage("error", `❌ ${data.message}`);
      currentAssistantEl = null;
      break;

    case "done":
      statusEl.textContent = "就绪";
      setBusy(false);
      break;
  }
}

function setBusy(b) {
  sendBtn.disabled = b;
  inputEl.disabled = b;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || !currentSid || !ws || ws.readyState !== 1) return;

  if (messagesEl.querySelector(".empty")) messagesEl.innerHTML = "";

  appendMessage("user", text);
  scrollBottom();

  inputEl.value = "";
  autoResize();

  setBusy(true);
  statusEl.textContent = "生成中...";
  ws.send(JSON.stringify({ type: "user_message", text }));
}

function appendMessage(role, content) {
  if (messagesEl.querySelector(".empty")) messagesEl.innerHTML = "";
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = escapeHtml(content || "").replace(/\n/g, "<br>");
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}

function appendThinking(text) {
  if (messagesEl.querySelector(".empty")) messagesEl.innerHTML = "";
  const div = document.createElement("div");
  div.className = "msg thinking";
  div.innerHTML = `<div class="label">💭 思考过程</div><div class="body">${escapeHtml(text).replace(/\n/g, "<br>")}</div>`;
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}

function appendTool(name, args, result) {
  if (messagesEl.querySelector(".empty")) messagesEl.innerHTML = "";
  const div = document.createElement("div");
  div.className = "msg tool";
  const argsStr = (() => {
    try { return JSON.stringify(args); } catch (e) { return String(args); }
  })();
  let html = `<div class="label">🔧 ${escapeHtml(name)}</div>`;
  html += `<div class="body">参数: ${escapeHtml(argsStr)}`;
  if (result) {
    html += `<br>结果: ${escapeHtml(result).replace(/\n/g, '<br>')}`;
  }
  html += `</div>`;
  div.innerHTML = html;
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function autoResize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
}
inputEl.addEventListener("input", autoResize);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener("click", send);
newBtn.addEventListener("click", newSession);

refreshSessions();
</script>
</body>
</html>
